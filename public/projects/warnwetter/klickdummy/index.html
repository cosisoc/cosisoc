<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wetter-App Klickdummy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <div class="device-slot" id="slot">
      <div class="device" id="device">
        <div class="screen" id="screen">
          <div class="statusbar" aria-hidden="true">
            <span class="statusbar__time">18:45</span>
            <span class="statusbar__icons">
              <svg width="19" height="12" viewBox="0 0 19 12"><rect x="0" y="8" width="3.2" height="4" rx="1" fill="#000"/><rect x="5" y="5.5" width="3.2" height="6.5" rx="1" fill="#000"/><rect x="10" y="3" width="3.2" height="9" rx="1" fill="#000"/><rect x="15" y="0" width="3.2" height="12" rx="1" fill="#000"/></svg>
              <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.6c2.4 0 4.6.9 6.3 2.5l1.2-1.3A10.4 10.4 0 0 0 8.5.8 10.4 10.4 0 0 0 1 3.8l1.2 1.3a8.6 8.6 0 0 1 6.3-2.5Zm0 3.5c1.4 0 2.7.5 3.8 1.5l1.2-1.3a7.3 7.3 0 0 0-10 0l1.2 1.3c1-.9 2.4-1.5 3.8-1.5Zm0 3.4c-.6 0-1.1.2-1.5.6L8.5 12 10 10.1c-.4-.4-.9-.6-1.5-.6Z" fill="#000"/></svg>
              <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" stroke="#000" opacity=".4" fill="none"/><rect x="2" y="2" width="20" height="9" rx="2.5" fill="#000"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill="#000" opacity=".45"/></svg>
            </span>
          </div>
          <div class="island" aria-hidden="true"></div>

          <section class="view" data-view="welcome"></section>
          <section class="view" data-view="modules"></section>
          <section class="view" data-view="mapcfg"></section>
          <section class="view" data-view="search"></section>
          <section class="view" data-view="home"></section>
          <section class="view main" data-view="main"></section>

          <div class="toast" id="toast" role="status" aria-live="polite"></div>
          <div class="home-indicator" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <button class="restart" id="restart" type="button">Prototyp neu starten</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
